# Bandit — Python-specific security linter
#
# Fast, lightweight static scanner purpose-built for Python. Complements
# CodeQL by catching Python-specific footguns quickly (hardcoded passwords/
# secrets, use of eval/exec, insecure use of subprocess/shell=True, weak
# crypto/hashing calls, assert statements left in production code, etc.).
#
# Runs on every PR and push to main/develop — it's fast enough to run on
# every change rather than being scheduled like CodeQL's deeper scan.
#
# Scans both apps/ (business logic) and contact_hub_api/ (settings, celery config,
# urls, wsgi/asgi) — your own code, not third-party dependencies.
#
# -ll flag = only report MEDIUM and HIGH severity findings (suppresses LOW
# severity noise). Change to -lll for HIGH-only if it gets too chatty.

name: Bandit Security Scan

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Bandit
        # Installed as an isolated tool (not added to pyproject.toml) since
        # it's a CI-only dependency, not something the app needs at runtime
        run: uv tool install bandit

      - name: Run Bandit
        run: uv tool run bandit -r apps/ contact_hub_api/ -ll --skip B113

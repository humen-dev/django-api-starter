name: Deploy to EC2 via SSM

#on:
#  push:
#    branches: [ "main" ]

on: workflow_dispatch

jobs:
#  Build-Docker-Containers:
#    uses: optnetwork/contact_hub_api/.github/workflows/containers-build.yml@main
#  unit-tests:
#    uses: optnetwork/contact_hub_api/.github/workflows/run-unit-tests.yml@main
  deploy:
    runs-on: ubuntu-latest
#    needs: [ unit-tests, Build-Docker-Containers ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions" \
            --parameters commands='[
              "set -e",
              "sudo -u ec2-user -H bash -lc \"git config --global --add safe.directory /home/ec2-user/projects/contact_hub_api\"",
              "sudo -u ec2-user -H bash -lc \"cd /home/ec2-user/projects/contact_hub_api && git pull origin main\"",
              "sudo -u ec2-user -H bash -lc \"cd /home/ec2-user/projects/contact_hub_api && docker compose -f docker-compose-prod.yml down\"",
              "sudo -u ec2-user -H bash -lc \"cd /home/ec2-user/projects/contact_hub_api && docker compose -f docker-compose-prod.yml up -d --build\"",
              "sudo -u ec2-user -H bash -lc \"docker system prune -f\""
            ]' \
            --query "Command.CommandId" \
            --output text
